[package]
name = "goose"
version = "1.0.0"
edition = "2021"
authors = ["Block <ai-oss-tools@block.xyz>"]
license = "Apache-2.0"
repository = "https://github.com/block/goose"
description = "Message model and provider wire formats for the goose agent"

[dependencies]
mcp-core = { path = "../mcp-core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11.1"
chrono = { version = "0.4.38", features = ["serde"] }
